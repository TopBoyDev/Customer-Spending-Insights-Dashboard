<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004973" />
    <meta name="description" content="Customer spending insights dashboard." />
    <title>Spending Insights</title>
    <style>
      /* Pre-render shell: paints immediately, before any JavaScript, and is replaced on mount. */
      html,
      body {
        margin: 0;
        background: #f2f4f7;
      }
      .boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #004973;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .boot-mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(150deg, #00598a, #004973 45%, #00344f);
        display: grid;
        place-items: center;
        box-shadow: 0 12px 32px -10px rgba(0, 52, 79, 0.55);
      }
      .boot-bar {
        width: 120px;
        height: 4px;
        margin: 20px auto 0;
        border-radius: 2px;
        background: linear-gradient(90deg, #dbe6ee 0%, #004973 50%, #dbe6ee 100%);
        background-size: 200% 100%;
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -100% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>This dashboard needs JavaScript to be enabled.</noscript>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Spending Insights">
        <div>
          <div class="boot-brand">
            <span class="boot-mark" aria-hidden="true">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3.5 17.5l6-6 4 4 7-8" />
              </svg>
            </span>
            Spending Insights
          </div>
          <div class="boot-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
