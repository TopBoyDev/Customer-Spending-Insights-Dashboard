name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit, API and component tests
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop and mobile)
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build

      - name: Lighthouse CI (performance, accessibility, best practices, size budgets)
        run: npm run test:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image the baselines were generated in, so rendering is identical.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Compare screenshots with committed baselines
        run: npm run test:visual
        env:
          CI: 'true'

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t spending-insights .

      - name: Smoke test container
        run: |
          docker run -d --name app -p 3000:3000 spending-insights
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          curl -fsS "http://localhost:3000/api/customers/12345/spending/summary?period=30d"
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          docker rm -f app
